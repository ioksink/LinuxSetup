baseURL: "https://ioksink.github.io/MelissasNotebook/"
locale: "en-uk"
title: "Melissa's Notebook"
theme: ["PaperMod"]
copyright: © 2026 Melissa Kueh

params:
  env: production
  defaultTheme: light
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: true
  displayFullLangName: true

  profileMode:
    enabled: true
    Title: "Welcome to Melissa's Notebook!"
    Subtitle: "My space for Linux exploration notes, university related digital service guide, and random gibberish. Email me if you have any question or issue! 👇"
    imageUrl: "avatar-sweet-potato.jpg"

  socialIcons:
    - name: "twitter"
      url: "https://x.com/MelissaK_030"
    - name: "github"
      url: "https://github.com/ioksink"
    - name: "email"
      url: "mailto:ioksin.kueh@gmail.com"
  editPost:
    URL: "https://github.com/ioksink/MelissasNotebook/content"
    Text: "Edit" # edit text
    appendFilePath: true # to append file path to Edit link

menu:
  main:
    - name: "News"
      url: /News/
      weight: 10
    - name: "Uni Guide"
      url: /uni/
      weight: 20
    - name: "Tech"
      url: /tech/
      weight: 30
    - name: "zh-Blog"
      url: /Blog/
      weight: 40
    - name: Note
      url: /Note/
      weight: 50

enableGitInfo: true
frontmatter:
  lastmod:
    - lastmod
    - :git
    - date

languages:
  en:
    languageName: "English"
    languageCode: "en-uk"
  'zh-tw':
    languageName: "繁體中文"
    languageCode: "zh-tw"
